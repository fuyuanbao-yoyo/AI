<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的星星罐</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="header">
  <div id="child-switcher"></div>
  <div class="star-total">⭐ <span id="total">0</span></div>
</div>

<div class="jar-box">
  <div class="jar-text">当前星星：<span id="current">0</span> 颗</div>
  <div class="jar" id="jar-stars">⭐</div>
  <div class="medal-show" id="medal-show"></div>
</div>

<div class="wish-box">
  <div class="wish-title">🎯 愿望兑换</div>
  <div class="wish-list" id="wish-list"></div>
</div>

<div class="exchanged-box" id="exchanged-box"></div>

<div class="history-box" id="history-box">
  <div class="history-title">📜 星星获取记录</div>
  <div id="history-list"></div>
</div>

<div class="nav-bar">
  <a class="nav-item" href="../index.html">
    <span class="nav-icon">🏠</span>首页
  </a>
  <a class="nav-item" href="checkin.html">
    <span class="nav-icon">📝</span>打卡
  </a>
  <a class="nav-item" href="rank.html">
    <span class="nav-icon">🏆</span>排行
  </a>
  <a class="nav-item" href="mine.html">
    <span class="nav-icon">👨‍👩‍👧</span>我的
  </a>
</div>

<script src="js/app.js"></script>
<script>
initStarsPage();
const totalEl = document.getElementById('total');
if(totalEl) totalEl.innerText = getStars();
// 渲染勋章
const medals = getData().medals;
const medalShow = document.getElementById('medal-show');
if (medals.length > 0 && medalShow) {
  medalShow.innerHTML = medals.map(m => `<span class="medal-badge">${m.icon} ${m.name}</span>`).join('');
}
// 渲染星星历史
const hist = getStarHistory();
const histList = document.getElementById('history-list');
if (histList) {
  if (hist.length === 0) {
    histList.innerHTML = '<div class="history-item"><span>暂无记录</span></div>';
  } else {
    histList.innerHTML = hist.slice(0, 20).map(h =>
      `<div class="history-item"><span>${h.note}</span><span>${h.date}</span></div>`
    ).join('');
  }
}
</script>
</body>
</html>
